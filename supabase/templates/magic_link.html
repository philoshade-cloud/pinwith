<!-- Paste into Supabase → Authentication → Emails → Templates → "Magic Link". Subject: Your PinWith sign-in link -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1a1a1a">
  <h2 style="margin:0 0 16px;font-size:20px">PinWith</h2>
  <p style="font-size:15px;line-height:1.6;margin:0 0 20px">Tap the button below to sign in to PinWith. The link works once, for 1 hour.</p>
  <p style="margin:0 0 24px"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#111;color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:600;font-size:15px">Sign in</a></p>
  <p style="font-size:13px;line-height:1.6;color:#888;margin:0">If you didn't request this, you can ignore this email. Your account is safe.<br><br>
  PinWith · support@pinwith.me</p>
</div>
